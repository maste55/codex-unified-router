<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Codex 统一配置器</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Microsoft YaHei",sans-serif; background:#1a1a2e; color:#e0e0e0; padding:20px; max-width:960px; margin:0 auto; }
h1 { font-size:20px; margin-bottom:6px; color:#fff; }
.sub { color:#888; font-size:12px; margin-bottom:18px; }
.tabs { display:flex; gap:4px; margin-bottom:18px; border-bottom:1px solid #333; }
.tab { padding:9px 20px; cursor:pointer; border:none; background:transparent; color:#999; font-size:14px; border-bottom:2px solid transparent; }
.tab.active { color:#fff; border-bottom-color:#4fc3f7; }
.tab-panel { display:none; }
.tab-panel.active { display:block; }
.search { width:100%; max-width:400px; padding:8px 12px; border-radius:6px; border:1px solid #333; background:#16213e; color:#e0e0e0; margin-bottom:16px; font-size:14px; }
.model { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:#16213e; border-radius:8px; margin-bottom:8px; border:1px solid #222; }
.model:hover { border-color:#444; }
.info { flex:1; }
.name { font-size:14px; color:#fff; word-break:break-all; }
.desc { font-size:11px; color:#888; margin-top:2px; }
.switch { position:relative; width:44px; height:24px; flex-shrink:0; margin-left:12px; }
.switch input { opacity:0; width:0; height:0; }
.slider { position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background:#444; border-radius:24px; transition:.3s; }
.slider:before { position:absolute; content:""; height:18px; width:18px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.3s; }
input:checked + .slider { background:#4caf50; }
input:checked + .slider:before { transform:translateX(20px); }
.summary { margin-bottom:14px; font-size:13px; color:#aaa; }
.group-title { font-size:13px; color:#4fc3f7; margin:18px 0 8px; font-weight:bold; }
.actions { margin-top:16px; }
.actions button { padding:8px 18px; border:none; border-radius:6px; color:#fff; cursor:pointer; margin-right:10px; font-size:13px; }
.actions .on { background:#4caf50; }
.actions .off { background:#f44336; }
.toast { position:fixed; bottom:20px; right:20px; background:#333; color:#fff; padding:10px 16px; border-radius:6px; display:none; font-size:13px; z-index:99; }
.key-form { background:#16213e; padding:16px; border-radius:8px; margin-bottom:16px; border:1px solid #222; }
.key-form input, .key-form select { width:100%; padding:8px 12px; border-radius:6px; border:1px solid #333; background:#0f1a30; color:#e0e0e0; margin-bottom:10px; font-size:14px; }
.key-form .row { display:flex; gap:10px; }
.key-form .row input, .key-form .row select { flex:1; }
.btn { padding:8px 18px; border:none; border-radius:6px; cursor:pointer; font-size:13px; color:#fff; }
.btn-primary { background:#2196f3; }
.btn-danger { background:#f44336; }
.btn-small { padding:5px 12px; font-size:12px; background:#333; }
.key-item { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:#16213e; border-radius:8px; margin-bottom:8px; border:1px solid #222; }
.key-item .kname { font-size:14px; color:#fff; font-weight:bold; }
.key-item .kmasked { font-size:12px; color:#888; margin-top:2px; font-family:monospace; }
.key-item .kdesc { font-size:11px; color:#666; margin-top:2px; }
.svc-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; margin-bottom:20px; }
.svc-card { background:#16213e; padding:16px; border-radius:8px; border:1px solid #222; }
.svc-name { font-size:15px; color:#fff; font-weight:bold; margin-bottom:6px; }
.svc-status { font-size:13px; margin-bottom:4px; }
.svc-status .up { color:#4caf50; font-weight:bold; }
.svc-status .down { color:#f44336; font-weight:bold; }
.svc-meta { font-size:11px; color:#888; }
.stat-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #222; font-size:13px; }
.stat-row .label { color:#999; }
.stat-row .value { color:#fff; }
.section-title { font-size:15px; color:#fff; margin:18px 0 10px; }
</style>
</head>
<body>
<h1>🎛️ Codex 统一配置器</h1>
<div class="sub">模型开关 · API Key 管理 · 程序状态 — 修改后重启 Codex 生效</div>

<div class="tabs">
  <button class="tab active" data-tab="models" onclick="switchTab('models')">📦 模型开关</button>
  <button class="tab" data-tab="keys" onclick="switchTab('keys')">🔑 API Key</button>
  <button class="tab" data-tab="system" onclick="switchTab('system')">⚙️ 程序管理</button>
</div>

<div class="tab-panel active" id="tab-models">
  <input class="search" id="search" placeholder="搜索模型名称...">
  <div class="summary" id="summary"></div>
  <div id="list"></div>
  <div class="actions">
    <button class="on" onclick="setAll(true)">全部显示</button>
    <button class="off" onclick="setAll(false)">全部隐藏</button>
  </div>
</div>

<div class="tab-panel" id="tab-keys">
  <div class="key-form">
    <div class="row">
      <select id="keyGroup" onchange="groupChanged()">
        <option value="opencode-go">🚀 opencode-go 订阅</option>
        <option value="dashscope">☁️ 阿里云 DashScope</option>
        <option value="deepseek">🧠 DeepSeek</option>
        <option value="chatgpt">💬 ChatGPT 官方</option>
        <option value="other">🔧 其他</option>
      </select>
      <input id="keyValue" placeholder="粘贴 API Key" type="password">
    </div>
    <input id="keyDesc" placeholder="备注（可选）">
    <div class="actions">
      <button class="btn btn-primary" onclick="addKey()">💾 保存 Key</button>
      <button class="btn" style="background:#ff9800" onclick="testKeyField()">🧪 测试 Key</button>
    </div>
  </div>
  <div class="summary" id="keySummary"></div>
  <div id="keyList"></div>
</div>

<div class="tab-panel" id="tab-system">
  <div class="section-title">服务状态</div>
  <div class="svc-grid" id="svcGrid"></div>
  <div class="section-title">统计</div>
  <div id="stats"></div>
  <div class="actions" style="margin-top:20px">
    <button class="btn btn-primary" onclick="restartRouter()">🔄 重启 router</button>
    <button class="btn" style="background:#ff9800" onclick="loadSystem()">📡 刷新状态</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const PANEL_TOKEN = "__PANEL_TOKEN__";
async function apiFetch(url, opts) {
  opts = opts || {};
  opts.headers = opts.headers || {};
  opts.headers["X-Panel-Token"] = PANEL_TOKEN;
  const sep = url.includes("?") ? "&" : "?";
  return fetch(url + sep + "token=" + PANEL_TOKEN, opts);
}
let MODELS = [];
const LABELS = ["opencode-go 订阅", "阿里云 DashScope", "DeepSeek", "官方 ChatGPT"];
function groupOf(slug) {
  if (slug.startsWith("opencode-go/") || slug.startsWith("opencode-go:")) return 0;
  if (slug.startsWith("qwen-dashscope/") || slug.startsWith("qwen-dashscope:")) return 1;
  if (slug.startsWith("deepseek-")) return 2;
  return 3;
}
function switchTab(name) {
  document.querySelectorAll(".tab").forEach(function(t) { t.classList.toggle("active", t.dataset.tab === name); });
  document.querySelectorAll(".tab-panel").forEach(function(p) { p.classList.toggle("active", p.id === "tab-" + name); });
  if (name === "keys") loadKeys();
  if (name === "system") loadSystem();
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(function() { t.style.display = "none"; }, 2500);
}
// ===== 模型 =====
async function load() {
  const r = await apiFetch("/panel/api/models");
  MODELS = (await r.json()).models || [];
  render();
}
function render() {
  const q = document.getElementById("search").value.toLowerCase();
  const shown = MODELS.filter(function(m) { return m.slug.toLowerCase().includes(q); });
  const on = MODELS.filter(function(m) { return m.enabled; }).length;
  document.getElementById("summary").textContent = "共 " + MODELS.length + " 个模型，当前显示 " + on + " 个";
  const list = document.getElementById("list");
  list.innerHTML = "";
  for (let g = 0; g < 4; g++) {
    const real = shown.filter(function(m) { return groupOf(m.slug) === g; });
    if (real.length === 0) continue;
    const div = document.createElement("div");
    div.className = "group-title";
    div.textContent = LABELS[g] + " (" + real.length + ")";
    list.appendChild(div);
    for (const m of real) {
      const row = document.createElement("div");
      row.className = "model";
      const info = document.createElement("div");
      info.className = "info";
      const nm = document.createElement("div");
      nm.className = "name"; nm.textContent = m.slug;
      const dc = document.createElement("div");
      dc.className = "desc"; dc.textContent = m.description || "";
      info.appendChild(nm); info.appendChild(dc);
      const lbl = document.createElement("label");
      lbl.className = "switch";
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = m.enabled;
      cb.onchange = function() { toggle(m.slug, this.checked); };
      const sl = document.createElement("span");
      sl.className = "slider";
      lbl.appendChild(cb); lbl.appendChild(sl);
      row.appendChild(info); row.appendChild(lbl);
      list.appendChild(row);
    }
  }
}
async function toggle(slug, enabled) {
  const r = await apiFetch("/panel/api/toggle", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ slug: slug, enabled: enabled }),
  });
  toast((enabled ? "显示: " : "隐藏: ") + slug + "（重启 Codex 生效）");
}
async function setAll(v) {
  for (const m of MODELS) {
    if (m.enabled !== v) {
      await apiFetch("/panel/api/toggle", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ slug: m.slug, enabled: v }),
      });
    }
  }
  await load();
  toast(v ? "全部显示（重启 Codex 生效）" : "全部隐藏（重启 Codex 生效）");
}
document.getElementById("search").addEventListener("input", render);
// ===== Key 管理 =====
const GROUP_KEY_MAP = {
  "opencode-go": "opencode:opencode-go",
  "dashscope": "opencode:qwen",
  "deepseek": "opencode:deepseek",
  "chatgpt": "codex:chatgpt-access-token",
};
let KEY_DATA = { keys: [], groups: [] };
function groupChanged() {
  const g = document.getElementById("keyGroup").value;
  const name = GROUP_KEY_MAP[g];
  if (name) {
    const existing = KEY_DATA.keys.find(function(k) { return k.name === name; });
    if (existing) {
      document.getElementById("keyValue").value = "";
      document.getElementById("keyDesc").value = existing.desc || "";
      document.getElementById("keyValue").placeholder = "当前: " + existing.masked + "（留空=不改）";
    }
  }
}
async function loadKeys() {
  const r = await apiFetch("/panel/api/keys");
  KEY_DATA = await r.json();
  const keys = KEY_DATA.keys || [];
  const groups = KEY_DATA.groups || [];
  document.getElementById("keySummary").textContent = "共 " + keys.length + " 个 key（DPAPI 加密存储）";
  const list = document.getElementById("keyList");
  list.innerHTML = "";
  for (const g of groups) {
    if (g.id === "other") continue;
    const items = keys.filter(function(k) { return k.group === g.id; });
    if (items.length === 0) continue;
    const gdiv = document.createElement("div");
    gdiv.className = "group-title";
    gdiv.style.display = "flex";
    gdiv.style.alignItems = "center";
    gdiv.style.justifyContent = "space-between";
    const gl = document.createElement("span");
    gl.textContent = g.icon + " " + g.label + " (" + items.length + ")" + (g.typeNote ? "  ·  " + g.typeNote : "");
    gdiv.appendChild(gl);
    if (g.renewUrl) {
      const rb = document.createElement("a");
      rb.href = g.renewUrl; rb.target = "_blank";
      rb.textContent = "💰 " + (g.renewLabel || "续费");
      rb.style.cssText = "font-size:12px;color:#ffd54f;text-decoration:none;border:1px solid #ffd54f;padding:3px 10px;border-radius:4px;";
      rb.onclick = function() { toast("已跳转 " + g.label + " 官网"); };
      gdiv.appendChild(rb);
    }
    list.appendChild(gdiv);
    for (const k of items) renderKeyItem(list, k);
  }
  const others = keys.filter(function(k) { return k.group === "other"; });
  if (others.length) {
    const gdiv = document.createElement("div");
    gdiv.className = "group-title";
    gdiv.textContent = "🔧 其他 (" + others.length + ")";
    list.appendChild(gdiv);
    for (const k of others) renderKeyItem(list, k);
  }
}
function renderKeyItem(list, k) {
  const row = document.createElement("div");
  row.className = "key-item";
  const info = document.createElement("div");
  info.className = "info";
  const nm = document.createElement("div");
  nm.className = "kname"; nm.textContent = k.display;
  const ms = document.createElement("div");
  ms.className = "kmasked"; ms.textContent = k.masked;
  const dc = document.createElement("div");
  dc.className = "kdesc";
  dc.textContent = (k.typeTag ? "[" + k.typeTag + "]  " : "") + (k.desc || "") + (k.name !== k.display ? "  [" + k.name + "]" : "");
  info.appendChild(nm); info.appendChild(ms); info.appendChild(dc);
  const btns = document.createElement("div");
  btns.style.display = "flex"; btns.style.gap = "6px";
  const testB = document.createElement("button");
  testB.className = "btn btn-small"; testB.textContent = "测试";
  testB.style.background = "#ff9800";
  testB.onclick = function() { testKey(k.name, testB); };
  const editB = document.createElement("button");
  editB.className = "btn btn-small"; editB.textContent = "修改";
  editB.style.background = "#2196f3";
  editB.onclick = function() { editKey(k); };
  const delB = document.createElement("button");
  delB.className = "btn btn-small btn-danger"; delB.textContent = "删除";
  delB.onclick = function() { removeKey(k.name); };
  btns.appendChild(testB); btns.appendChild(editB); btns.appendChild(delB);
  row.appendChild(info); row.appendChild(btns);
  list.appendChild(row);
}
function editKey(k) {
  document.getElementById("keyGroup").value = k.group;
  document.getElementById("keyValue").value = "";
  document.getElementById("keyValue").placeholder = "当前: " + k.masked + "（留空=不改）";
  document.getElementById("keyDesc").value = k.desc || "";
  document.getElementById("keyValue").dataset.editName = k.name;
  toast("修改模式: " + k.display + " — 粘贴新 Key 或直接保存更新备注");
}
async function addKey() {
  const g = document.getElementById("keyGroup").value;
  const editName = document.getElementById("keyValue").dataset.editName || "";
  const name = editName || GROUP_KEY_MAP[g] || ("custom:" + Date.now());
  const key = document.getElementById("keyValue").value.trim();
  const desc = document.getElementById("keyDesc").value.trim();
  if (!key && !editName) { toast("请粘贴 API Key"); return; }
  if (editName && !key) {
    // 编辑模式：key 留空 = 只更新 desc，需要后端支持（后端已有逻辑：空 key 时保留原值）
  }
  const r = await apiFetch("/panel/api/keys", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: name, key: key, desc: desc, keepKey: editName && !key }),
  });
  const d = await r.json();
  if (d.ok) {
    toast(editName ? "已更新: " + d.masked : "已保存: " + d.masked);
    document.getElementById("keyValue").value = "";
    document.getElementById("keyValue").placeholder = "粘贴 API Key";
    document.getElementById("keyDesc").value = "";
    delete document.getElementById("keyValue").dataset.editName;
    loadKeys();
  } else { toast("失败: " + (d.error || "unknown")); }
}
async function removeKey(name) {
  if (!confirm("确定删除这个 Key ？")) return;
  const r = await apiFetch("/panel/api/keys?name=" + encodeURIComponent(name), { method: "DELETE" });
  const d = await r.json();
  if (d.ok) { toast("已删除"); loadKeys(); }
  else { toast("失败: " + (d.error || "unknown")); }
}
async function testKey(name, btn) {
  const orig = btn.textContent;
  btn.textContent = "测试中..."; btn.disabled = true;
  const r = await apiFetch("/panel/api/keys/test", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: name }),
  });
  const d = await r.json();
  btn.textContent = orig; btn.disabled = false;
  if (d.ok) toast("✅ " + (d.label || "") + " Key 有效（HTTP " + d.status + "）");
  else toast("❌ " + (d.label || "") + " Key 无效（HTTP " + d.status + "）" + (d.detail ? " " + d.detail : ""));
}
async function testKeyField() {
  const key = document.getElementById("keyValue").value.trim();
  if (!key) { toast("先粘贴要测试的 Key"); return; }
  const g = document.getElementById("keyGroup").value;
  const tempName = "panel:temp-test-" + Date.now();
  // 存到临时名（不覆盖原 key）
  const s = await apiFetch("/panel/api/keys", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: tempName, key: key }) });
  const sd = await s.json();
  if (!sd.ok) { toast("保存测试 Key 失败: " + (sd.error || "")); return; }
  const r = await apiFetch("/panel/api/keys/test", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: tempName }) });
  const d = await r.json();
  // 删掉临时 key（无论成败）
  await apiFetch("/panel/api/keys?name=" + encodeURIComponent(tempName), { method: "DELETE" });
  if (d.ok) toast("✅ " + (d.label || "") + " Key 有效（HTTP " + d.status + "），点保存入库");
  else toast("❌ " + (d.label || "") + " Key 无效（HTTP " + d.status + "）" + (d.detail ? " " + d.detail : ""));
}
// ===== 程序管理 =====
async function loadSystem() {
  const r = await apiFetch("/panel/api/system");
  const d = await r.json();
  const grid = document.getElementById("svcGrid");
  grid.innerHTML = "";
  const svcs = [
    { name: "unified-router", port: d.router.port, up: d.router.up, meta: "PID " + d.router.pid },
    { name: "codex-bridge", port: d.bridge.port, up: d.bridge.up, meta: "ChatGPT 官方模型桥" },
    { name: "ollama", port: d.ollama.port, up: d.ollama.up, meta: "本地模型" },
  ];
  for (const s of svcs) {
    const card = document.createElement("div");
    card.className = "svc-card";
    card.innerHTML = '<div class="svc-name">' + s.name + '</div>' +
      '<div class="svc-status">' + (s.up ? '<span class="up">● 运行中</span>' : '<span class="down">● 已停止</span>') + ' :' + s.port + '</div>' +
      '<div class="svc-meta">' + s.meta + '</div>';
    grid.appendChild(card);
  }
  document.getElementById("stats").innerHTML =
    '<div class="stat-row"><span class="label">已存 Key</span><span class="value">' + d.keys + ' 个</span></div>' +
    '<div class="stat-row"><span class="label">模型总数</span><span class="value">' + d.models.total + ' 个</span></div>' +
    '<div class="stat-row"><span class="label">可见模型</span><span class="value">' + d.models.visible + ' 个</span></div>' +
    '<div class="stat-row"><span class="label">Codex 目录</span><span class="value">' + d.models.catalog + ' 个</span></div>';
}
async function restartRouter() {
  if (!confirm("重启 unified-router？看门狗会自动拉起。")) return;
  await apiFetch("/panel/api/system/restart", { method: "POST" });
  toast("router 正在重启，看门狗自动接管...");
  setTimeout(loadSystem, 3000);
}
load();
</script>
</body>
</html>
